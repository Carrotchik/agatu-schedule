name: update-schedule
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python agatu_schedule.py --subgroup 1 --alarm 15 --out-dir .
      - name: Commit if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add theory.ics practice.ics dfk.ics
          git diff --cached --quiet || (git commit -m "Update schedule" && git push)
